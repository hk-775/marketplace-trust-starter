name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest
      - name: Verify static site mirror
        run: python scripts/build_site.py --check

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --disable-pip-version-check .
      - name: Start seeded service on port 8101
        env:
          MTS_DATABASE_PATH: ${{ runner.temp }}/smoke.db
        run: |
          marketplace-trust-starter --host 127.0.0.1 --port 8101 >"${RUNNER_TEMP}/server.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/server.pid"
      - name: Run live HTTP smoke test
        run: python scripts/smoke_test.py --base-url http://127.0.0.1:8101
      - name: Print server log on failure
        if: failure()
        run: cat "${RUNNER_TEMP}/server.log"
