[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-trust-starter"
version = "0.1.0"
description = "Deterministic, explainable trust-and-safety starter for marketplaces and communities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT-0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Marketplace Trust Starter contributors" }]
keywords = [
    "trust-and-safety",
    "marketplace",
    "moderation",
    "fraud",
    "human-review",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
    "setuptools>=75,<83",
    "websocket-client>=1.8,<2",
]

[project.scripts]
marketplace-trust-starter = "marketplace_trust_starter.__main__:main"

[project.urls]
Homepage = "https://hk-775.github.io/marketplace-trust-starter/"
Repository = "https://github.com/hk-775/marketplace-trust-starter"
Issues = "https://github.com/hk-775/marketplace-trust-starter/issues"
Documentation = "https://github.com/hk-775/marketplace-trust-starter/tree/main/docs"
Changelog = "https://github.com/hk-775/marketplace-trust-starter/blob/main/CHANGELOG.md"
Security = "https://github.com/hk-775/marketplace-trust-starter/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marketplace_trust_starter = [
    "web/*.html",
    "web/assets/*.css",
    "web/assets/*.drawio",
    "web/assets/*.js",
    "web/assets/*.json",
    "web/assets/*.png",
    "web/assets/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["marketplace_trust_starter"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
